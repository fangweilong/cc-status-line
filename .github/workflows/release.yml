name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
            binary_name: statusline-windows-amd64.exe
            src_binary: dist/statusline.exe
          - os: windows-11-arm
            target: windows-arm64
            binary_name: statusline-windows-arm64.exe
            src_binary: dist/statusline.exe
          - os: ubuntu-latest
            target: linux-amd64
            binary_name: statusline-linux-amd64
            src_binary: dist/statusline
          - os: ubuntu-24.04-arm
            target: linux-arm64
            binary_name: statusline-linux-arm64
            src_binary: dist/statusline
          - os: macos-14
            target: darwin-arm64
            binary_name: statusline-darwin-arm64
            src_binary: dist/statusline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build standalone executable
        run: |
          pyinstaller --onefile --clean --name statusline statusline.py

      - name: Prepare binary artifact
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp ${{ matrix.src_binary }} release-artifacts/${{ matrix.binary_name }}
          chmod +x release-artifacts/${{ matrix.binary_name }} || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: release-artifacts/${{ matrix.binary_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-binaries
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-binaries/*
          generate_release_notes: true
          draft: false
          prerelease: false
